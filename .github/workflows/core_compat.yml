# Core compatibility: runs this app's suite against an unreleased camaleon_cms commit instead of the
# released gem the committed Gemfile.lock pins. camaleon_cms calls it from its own pipeline
# (.github/workflows/ecosystem.yml there) with the commit under test, so a CMS change that breaks
# this app shows up as a check on the camaleon_cms pull request.
#
# A called workflow runs in the CALLER's context: `github.repository`, `github.sha` and a bare
# `actions/checkout` all mean camaleon_cms there, not this repository. Both checkouts below therefore
# name their repository and ref explicitly, side by side under the workspace.
#
# Deliberately no `workflow_dispatch`: a manual run executes in this repository's default-branch
# context, where code checked out from a free-form ref could write the Actions caches every later run
# restores. A pull request run has no such reach, so to try a camaleon_cms branch by hand, open a
# draft pull request there.
name: Core compatibility

on:
  workflow_call:
    inputs:
      camaleon_cms_repository:
        description: 'owner/name of the camaleon_cms repository to test against'
        type: string
        default: owen2345/camaleon-cms
      camaleon_cms_ref:
        description: 'camaleon_cms commit, branch or tag to test against'
        type: string
        default: master
      member_ref:
        description: 'florsan commit, branch or tag to test'
        type: string
        default: main

permissions:
  contents: read

jobs:
  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    # Same database service as the rspec job in ci.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: florsan_dev
          POSTGRES_PASSWORD: florsan_pass
          POSTGRES_DB: florsan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U florsan_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      # The Gemfile sources camaleon_cms from this path when it is set. Bundler resolves it relative
      # to the Gemfile, so it points at the sibling checkout below.
      CAMALEON_CMS_PATH: ../camaleon_cms
    defaults:
      run:
        working-directory: member

    steps:
      - name: Check out florsan
        uses: actions/checkout@v7
        with:
          repository: texpert/florsan
          ref: ${{ inputs.member_ref }}
          path: member
          persist-credentials: false

      - name: Check out camaleon_cms
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.camaleon_cms_repository }}
          ref: ${{ inputs.camaleon_cms_ref }}
          path: camaleon_cms
          persist-credentials: false

      # No `bundler-cache: true` here, unlike ci.yml: with a lockfile present it installs in
      # deployment mode, which refuses a Gemfile that no longer matches the committed lock, and the
      # path-sourced camaleon_cms is exactly that.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          rubygems: 4.0.19
          working-directory: member

      # `bundle lock` starts from the committed lock and unlocks only what changed: camaleon_cms, now
      # path-sourced, and whatever its gemspec at this commit newly requires. Every other gem stays
      # at the version this app runs in production, so a failure points at the CMS rather than at
      # dependency drift. The diff is printed so a gem that did move is visible in the log.
      - name: Re-resolve the bundle against the core under test
        run: |
          git -C ../camaleon_cms log -1 --format='camaleon_cms under test: %H %s'
          git log -1 --format='florsan under test: %H %s'
          bundle config set --local path vendor/bundle
          bundle lock
          git --no-pager diff -- Gemfile.lock

      - name: Cache the bundle
        uses: actions/cache@v6
        with:
          path: member/vendor/bundle
          key: core-compat-florsan-${{ runner.os }}-${{ hashFiles('member/.tool-versions', 'member/Gemfile.lock') }}
          restore-keys: |
            core-compat-florsan-${{ runner.os }}-

      - name: Install the bundle
        run: bundle install --jobs 4

      # This app copies the engines' migrations into db/migrate (config/system.json turns
      # auto_include_migrations off), so a migration the CMS under test adds is not seen until it is
      # copied. railties:install:migrations copies only what is missing, stamped later than the
      # checked-in schema; loading that schema then leaves exactly those pending, and db:migrate
      # applies them. With nothing new all three steps leave the schema as committed.
      - name: Prepare the test database
        run: |
          bin/rails railties:install:migrations
          bin/rails db:test:prepare
          bin/rails db:migrate

      - name: Run the test suite
        run: bin/rspec
