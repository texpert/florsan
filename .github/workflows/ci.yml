# Runs on: a push to a branch of this repository.
# Tests:   the pushed commit of this app, against the released camaleon_cms gem that Gemfile.lock
#          pins.
# Checks:  `test-on-push / rspec (camaleon_cms <version>)`, and the lint and audit checks.
#
# The checks against Camaleon code that is not released are in camaleon_master.yml and
# core_compat.yml.
name: "test-on-push"
permissions:
  contents: read
  pull-requests: write
on: [push]
# Scope by ref: this workflow triggers on push, where github.event.pull_request.number
# is always empty — with it, every push across all branches shared one concurrency
# group and cancelled each other's in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reads the camaleon_cms version that Gemfile.lock pins. The name of the rspec check shows it.
  locked:
    name: camaleon_cms version of Gemfile.lock
    runs-on: ubuntu-latest
    outputs:
      camaleon_cms: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout Gemfile.lock
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: Gemfile.lock
          sparse-checkout-cone-mode: false
      - name: Read the version
        id: read
        run: |
          version=$(sed -n 's/^    camaleon_cms (\([0-9][0-9A-Za-z.]*\))$/\1/p' Gemfile.lock | head -n 1)
          echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"

  eslint:
    if: |
      !contains(github.event.pull_request.title, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable && corepack prepare yarn@4.19.0
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: 'yarn'
      - name: install app dependencies
        run: yarn install --frozen-lockfile
      - name: ESLint
        run: yarn eslint

  stylelint:
    if: |
      !contains(github.event.pull_request.title, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable && corepack prepare yarn@4.19.0
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: 'yarn'
      - name: install app dependencies
        run: yarn install --frozen-lockfile
      - name: Stylelint
        run: yarn stylelint "**/*.{css,js,scss}" -f unix

  rubocop:
    if: |
      !contains(github.event.pull_request.title, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          rubygems: 4.0.23
          bundler-cache: true
      - name: Lint Ruby files
        run: bin/rubocop --parallel
  security:
    if: |
      !contains(github.event.pull_request.title, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          rubygems: 4.0.23
          bundler-cache: true
      - name: Security audit dependencies
        run: bin/bundle-audit check --update --ignore CVE-2018-18260 CVE-2024-48652
      - name: Security audit application code
        run: bin/brakeman
  rspec:
    name: rspec (camaleon_cms ${{ needs.locked.outputs.camaleon_cms }})
    needs: locked
    if: |
      !contains(github.event.pull_request.title, '[skip ci]')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: florsan_dev
          POSTGRES_PASSWORD: florsan_pass
          POSTGRES_DB: florsan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U florsan_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          rubygems: 4.0.23
          bundler-cache: true
      - name: Prepare test database
        run: bin/rails db:test:prepare
      - name: Run RSpec
        run: bin/rspec
