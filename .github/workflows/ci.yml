name: "test-on-push"
permissions:
  contents: read
  pull-requests: write
on: [push]
# Scope by ref: this workflow triggers on push, where github.event.pull_request.number
# is always empty — with it, every push across all branches shared one concurrency
# group and cancelled each other's in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    if: |
      !contains(github.event.pull_request.title, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable && corepack prepare yarn@4.17.0
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26.4.0
          cache: 'yarn'
      - name: install app dependencies
        run: yarn install --frozen-lockfile
      - name: ESLint
        run: yarn eslint

  stylelint:
    if: |
      !contains(github.event.pull_request.title, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable && corepack prepare yarn@4.17.0
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26.4.0
          cache: 'yarn'
      - name: install app dependencies
        run: yarn install --frozen-lockfile
      - name: Stylelint
        run: yarn stylelint "**/*.{css,js,scss}" -f unix

  rubocop:
    if: |
      !contains(github.event.pull_request.title, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          rubygems: 4.0.19
          bundler-cache: true
      - name: Lint Ruby files
        run: bin/rubocop --parallel
  security:
    if: |
      !contains(github.event.pull_request.title, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          rubygems: 4.0.19
          bundler-cache: true
      - name: Security audit dependencies
        run: bin/bundle-audit check --update --ignore CVE-2018-18260 CVE-2024-48652
      - name: Security audit application code
        run: bin/brakeman
  rspec:
    if: |
      !contains(github.event.pull_request.title, '[skip ci]')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: florsan_dev
          POSTGRES_PASSWORD: florsan_pass
          POSTGRES_DB: florsan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U florsan_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          rubygems: 4.0.19
          bundler-cache: true
      - name: Prepare test database
        run: bin/rails db:test:prepare
      - name: Run RSpec
        run: bin/rspec
